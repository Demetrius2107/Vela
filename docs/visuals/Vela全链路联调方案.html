<svg viewBox="0 0 680 520" width="100%" role="img">
  <title>Vela IM 全链路联调方案</title>
  <desc>三层验证方案：后端脚本验证、TCP协议验证、前端对接</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; fill: var(--color-text-primary, #2C2C2A); font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 12px; fill: var(--color-text-secondary, #5F5E5A); }
      .tc { font-family: var(--font-sans, sans-serif); font-size: 11px; fill: var(--color-text-tertiary, #888780); }
      .box { fill: var(--color-background-secondary, #F1EFE8); stroke: var(--color-border-tertiary, #B4B2A9); stroke-width: 0.5; }
      .arr { fill: none; stroke: var(--color-border-secondary, #5F5E5A); stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Phase 1 -->
  <rect x="30" y="20" width="620" height="140" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5" opacity="0.4"/>
  <text x="50" y="44" class="t" fill="#854F0B">Phase 1: 后端 API 脚本验证（不需要前端）</text>

  <g class="node c-amber">
    <rect x="50" y="60" width="120" height="56" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#BA7517"/>
    <text class="th" x="110" y="82" text-anchor="middle" dominant-baseline="central" fill="#633806">Docker 启动</text>
    <text class="ts" x="110" y="100" text-anchor="middle" dominant-baseline="central">MySQL Redis MQ ZK</text>
  </g>
  <line class="arr" x1="170" y1="88" x2="200" y2="88" marker-end="url(#arrow)"/>

  <g class="node c-amber">
    <rect x="200" y="60" width="120" height="56" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#BA7517"/>
    <text class="th" x="260" y="82" text-anchor="middle" dominant-baseline="central" fill="#633806">Maven 编译</text>
    <text class="ts" x="260" y="100" text-anchor="middle" dominant-baseline="central">mvn package</text>
  </g>
  <line class="arr" x1="320" y1="88" x2="350" y2="88" marker-end="url(#arrow)"/>

  <g class="node c-amber">
    <rect x="350" y="60" width="130" height="56" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#BA7517"/>
    <text class="th" x="415" y="82" text-anchor="middle" dominant-baseline="central" fill="#633806">启动核心服务</text>
    <text class="ts" x="415" y="100" text-anchor="middle" dominant-baseline="central">gateway user msg tcp</text>
  </g>
  <line class="arr" x1="480" y1="88" x2="510" y2="88" marker-end="url(#arrow)"/>

  <g class="node c-amber">
    <rect x="510" y="60" width="120" height="56" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#BA7517"/>
    <text class="th" x="570" y="82" text-anchor="middle" dominant-baseline="central" fill="#633806">Python 脚本</text>
    <text class="ts" x="570" y="100" text-anchor="middle" dominant-baseline="central">注册 登录 发消息</text>
  </g>

  <!-- Phase 2 -->
  <rect x="30" y="180" width="620" height="100" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text x="50" y="204" class="t" fill="#085041">Phase 2: TCP 协议验证</text>

  <g class="node c-teal">
    <rect x="50" y="220" width="150" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="th" x="125" y="242" text-anchor="middle" dominant-baseline="central" fill="#04342C">TCP 客户端脚本</text>
  </g>
  <line class="arr" x1="200" y1="242" x2="230" y2="242" marker-end="url(#arrow)"/>

  <g class="node c-teal">
    <rect x="230" y="220" width="150" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="th" x="305" y="242" text-anchor="middle" dominant-baseline="central" fill="#04342C">登录 0x2328</text>
  </g>
  <line class="arr" x1="380" y1="242" x2="410" y2="242" marker-end="url(#arrow)"/>

  <g class="node c-teal">
    <rect x="410" y="220" width="150" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="th" x="485" y="242" text-anchor="middle" dominant-baseline="central" fill="#04342C">P2P消息 0x44F</text>
  </g>
  <line class="arr" x1="560" y1="242" x2="590" y2="242" marker-end="url(#arrow)"/>

  <g class="node c-teal">
    <rect x="590" y="220" width="40" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="th" x="610" y="242" text-anchor="middle" dominant-baseline="central" fill="#04342C">ACK</text>
  </g>

  <!-- Phase 3 -->
  <rect x="30" y="300" width="620" height="100" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5" opacity="0.4"/>
  <text x="50" y="324" class="t" fill="#0C447C">Phase 3: 前端对接</text>

  <g class="node c-blue">
    <rect x="50" y="340" width="150" height="44" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="th" x="125" y="362" text-anchor="middle" dominant-baseline="central" fill="#042C53">修复登录页</text>
  </g>
  <line class="arr" x1="200" y1="362" x2="230" y2="362" marker-end="url(#arrow)"/>

  <g class="node c-blue">
    <rect x="230" y="340" width="150" height="44" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="th" x="305" y="362" text-anchor="middle" dominant-baseline="central" fill="#042C53">替换 Mock 数据</text>
  </g>
  <line class="arr" x1="380" y1="362" x2="410" y2="362" marker-end="url(#arrow)"/>

  <g class="node c-blue">
    <rect x="410" y="340" width="150" height="44" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="th" x="485" y="362" text-anchor="middle" dominant-baseline="central" fill="#042C53">WebSocket 集成</text>
  </g>
  <line class="arr" x1="560" y1="362" x2="590" y2="362" marker-end="url(#arrow)"/>

  <g class="node c-blue">
    <rect x="590" y="340" width="40" height="44" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="th" x="610" y="362" text-anchor="middle" dominant-baseline="central" fill="#042C53">OK</text>
  </g>

  <!-- Critical Issue -->
  <rect x="30" y="420" width="620" height="80" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5" opacity="0.5"/>
  <text x="50" y="444" class="t" fill="#791F1F">阻断问题：vela-service 空壳 + TCP 配置断裂</text>
  <text x="50" y="466" class="ts" fill="#A32D2D">vela-service (port 8000) 源码已清空，但 vela-tcp 的 logicUrl 仍指向 http://127.0.0.1:8000/v1</text>
  <text x="50" y="484" class="ts" fill="#A32D2D">修复：config.yml 中 logicUrl 改为 http://127.0.0.1:8888/v1 (网关) 或 http://127.0.0.1:8014/v1 (消息服务)</text>
</svg>
