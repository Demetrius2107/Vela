# ============================================================================
# Vela IM — Prometheus 配置
# 从 vela-service 的 /actuator/prometheus 端点采集指标
# ============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'vela-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          application: 'vela-service'
