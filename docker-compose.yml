# =============================================================================
# Vela IM — Docker Compose 配置
# 一键启动：MySQL + Redis + RabbitMQ + ZooKeeper + 三个业务服务
# =============================================================================
# 使用方式：
#   docker-compose up -d                          # 后台启动全部（含业务服务）
#   docker-compose -f docker-compose.yml -f docker-compose.middleware.yml up -d  # 只要中间件
#   docker-compose up -d vela-service              # 只启动某个服务
#   docker-compose logs -f vela-service            # 查看日志
#   docker-compose down                           # 停止全部
#   docker-compose down -v                        # 停止全部 + 删除数据卷（清空数据库）
# =============================================================================

services:

  # ==================== 中间件 ====================

  mysql:
    image: mysql:5.7
    container_name: vela-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vela
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/MySQL/vela-study.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docs/MySQL/vela-send.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2
    container_name: vela-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: vela-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理控制台
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: zookeeper:3.6
    container_name: vela-zk
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
    volumes:
      - zk-data:/data
      - zk-datalog:/datalog
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 业务服务 ====================

  vela-service:
    build:
      context: .
      dockerfile: vela-service/Dockerfile
    container_name: vela-service
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vela?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=UTF8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      APP_CONFIG_ZKADDR: zookeeper:2181
      APP_CONFIG_APPID: 10000
      SERVER_PORT: 8000

  vela-message-store:
    build:
      context: .
      dockerfile: vela-message-store/Dockerfile
    container_name: vela-message-store
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vela?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=UTF8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

  vela-tcp:
    build:
      context: .
      dockerfile: vela-tcp/Dockerfile
    container_name: vela-tcp
    restart: always
    ports:
      - "9000:9000"
      - "19000:19000"
    depends_on:
      vela-service:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    environment:
      LIM_TCPPORT: 9000
      LIM_WEBSOCKETPORT: 19000
      LIM_BROKERID: 1000
      LIM_LOGINMODEL: 3
      LIM_LOGICURL: http://vela-service:8000/v1
      LIM_REDIS_SINGLE_ADDRESS: redis:6379
      LIM_RABBITMQ_HOST: rabbitmq
      LIM_RABBITMQ_PORT: 5672
      LIM_RABBITMQ_USERNAME: guest
      LIM_RABBITMQ_PASSWORD: guest
      LIM_ZKCONFIG_ZKADDR: zookeeper:2181
    volumes:
      - ./vela-tcp/src/main/resources/config-docker.yml:/app/config.yml

# ==================== 监控服务 ====================

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vela-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - vela-service

  skywalking-oap:
    image: apache/skywalking-oap-server:8.9.1
    container_name: vela-skywalking-oap
    restart: always
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: h2
      SW_RECEIVER_GRPC: default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12800"]
      interval: 15s
      timeout: 5s
      retries: 3

  skywalking-ui:
    image: apache/skywalking-ui:8.9.1
    container_name: vela-skywalking-ui
    restart: always
    ports:
      - "8088:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      - skywalking-oap

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: vela-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.0.3
    container_name: vela-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  elasticsearch:
    image: elasticsearch:7.17.22
    container_name: vela-es
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:7.17.22
    container_name: vela-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  logstash:
    image: logstash:7.17.22
    container_name: vela-logstash
    restart: always
    ports:
      - "5044:5044"
      - "5000:5000"
    volumes:
      - ./deploy/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch

# ==================== 持久化卷 ====================

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  zk-data:
  zk-datalog:
  prometheus-data:
  grafana-data:
  es-data:
