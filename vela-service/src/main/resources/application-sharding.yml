# ============================================================================
# ShardingSphere 分库分表配置
# 说明：仅对消息历史表做分表（按月分片），其他表走默认数据源。
# 激活方式：spring.profiles.active=dev,sharding
# 注意：分片表需提前创建，如 vela_message_history_202601 ~ _202612
# ============================================================================
spring:
  shardingsphere:
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3307/vela?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=UTF8&allowPublicKeyRetrieval=true
        username: root
        password:
    rules:
      sharding:
        tables:
          vela_message_history:
            actual-data-nodes: ds0.vela_message_history_$->{2026..2027}0$->{1..9}, ds0.vela_message_history_$->{2026..2027}1$->{0..2}
            table-strategy:
              standard:
                sharding-column: create_time
                sharding-algorithm-name: month-shard
          vela_message_body:
            actual-data-nodes: ds0.vela_message_body_$->{2026..2027}0$->{1..9}, ds0.vela_message_body_$->{2026..2027}1$->{0..2}
            table-strategy:
              standard:
                sharding-column: create_time
                sharding-algorithm-name: month-shard
          vela_group_message_history:
            actual-data-nodes: ds0.vela_group_message_history_$->{2026..2027}0$->{1..9}, ds0.vela_group_message_history_$->{2026..2027}1$->{0..2}
            table-strategy:
              standard:
                sharding-column: create_time
                sharding-algorithm-name: month-shard
        sharding-algorithms:
          month-shard:
            type: INTERVAL
            props:
              datetime-pattern: yyyy-MM-dd HH:mm:ss
              datetime-lower: 2026-01-01 00:00:00
              datetime-upper: 2027-12-31 23:59:59
              sharding-suffix-pattern: yyyyMM
              datetime-interval-amount: 1
              datetime-interval-unit: MONTHS
    props:
      sql-show: false
